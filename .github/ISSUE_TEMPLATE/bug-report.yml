name: Bug Report
description: Something is broken or behaving unexpectedly
labels: ["needs-triage", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for filing a bug report. Fill in as much as you can — the more detail, the faster it moves to resolution.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One sentence describing the bug
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Numbered steps that reliably trigger the bug
      placeholder: "1. Go to...\n2. Click...\n3. See error"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What should have happened?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: What happened instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version / environment
      description: App version, OS, browser, or other relevant context
